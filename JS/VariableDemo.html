    <h1>Area Calculation</h1>

    <script>
      const PI = 3.14;
      var sqSideLength = 4;
      var rLength = 5;
      var rBreadth = 10;
      var radius = 6;

      var circleArea = PI * radius * radius;
      var sqaureArea = sqSideLength * sqSideLength;
      var rectangleArea = rLength * rBreadth;
      document.writeln(
        `Area of Circle : ${circleArea} <br> Area of Square : ${sqaureArea} <br> Area of Rectangle : ${rectangleArea}`,
      );
    </script>
