<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let age = Number.parseInt(prompt("Enter Age "));

      if (age >= 18 && age <= 60) {
        document.writeln(`<h1>Eligible to donate Blood!!!</h1>`);
      } else {
        document.writeln(`<h1>Not Eligible to donate Blood!!!</h1>`);
      }
    </script>
  </body>
</html>
