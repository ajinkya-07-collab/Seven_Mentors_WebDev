<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subtraction</title>
  </head>

  <body>
    <input type="number" id="num1" placeholder="Enter first number" />

    <input type="number" id="num2" placeholder="Enter second number" />

    <button id="subBtn">Subtract</button>

    <div>
      <h4 id="n1"></h4>
      <h4 id="n2"></h4>
      <h4 id="result"></h4>
      <h4 id="finalMessage"></h4>
    </div>

    <script>
      let num1 = document.getElementById("num1");
      let num2 = document.getElementById("num2");
      let subBtn = document.getElementById("subBtn");

      let n1 = document.getElementById("n1");
      let n2 = document.getElementById("n2");
      let result = document.getElementById("result");
      let finalMessage = document.getElementById("finalMessage");

      subBtn.addEventListener("click", () => {
        try {
          // Validation
          if (num1.value <= 0 || num2.value <= 0) {
            throw new Error("Numbers should be greater than 0");
          }

          // Display numbers
          n1.textContent = "Num1 : " + num1.value;
          n2.textContent = "Num2 : " + num2.value;

          // Subtraction
          let answer = num1.value - num2.value;

          result.textContent = "Subtraction = " + answer;

          // Check result
          if (answer < 0) {
            result.style.color = "red";
          } else {
            result.style.color = "green";
          }
        } catch (error) {
          result.textContent = error.message;
          result.style.color = "red";
        } finally {
          finalMessage.textContent = "Thanks for Using Calculator!!";
        }
      });
    </script>
  </body>
</html>
