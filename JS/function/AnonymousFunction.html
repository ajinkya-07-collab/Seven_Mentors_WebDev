<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>

    <body>

        <script>

            // Arrow Function
            let add = (a, b) => {
                let result = a + b;
                console.log(result);
            }

            add(10, 10);

            // Anomymous Funcion or Function Expression
            let show = function (num1, num2) {
                let result = num1 + num2;
                console.log(result);
            }

            show(10, 10);
        </script>
    </body>

</html>
