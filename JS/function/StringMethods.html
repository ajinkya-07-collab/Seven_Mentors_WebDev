        <script>
            let products = ['Dell laptop', 'Samsung Mobile', 'MI TV', 'iPhone 18 pro', 'Mouse', 'Keyboard', 'Tablet'];
            let searchText = prompt('Enter the product that u want to search!!');
            // let result = products.toString().includes(searchText);

                product.toLowerCase().includes(searchText.toLowerCase())
            );

            if (result.length > 0) {
                console.log(result);
            } else {
                console.log('Product Not found!');
            }

        </script>
