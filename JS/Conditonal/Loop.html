<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>

    <body>

        <script>

            let pin = "1234";
            let attempts = 0;
            let enteredPin;

            let balance = 20000;

            do {
                enteredPin = Number.parseInt(prompt(`Enter PIN ! (Only Three Attempts)`));
                attempts++;

                if (enteredPin != pin) {
                    console.log(`Incorrect PIN ! Attempt remaining : ${3 - attempts}`);
                }
            } while (enteredPin != pin && attempts < 3);

            if (enteredPin == pin) {
                while (balance > 0) {
                    let withdrawAmount = Number.parseFloat(prompt("Enter Withdrawal Ammount! \nIf u want to terminate the transaction please enter -1(to exit)"));
                    if (withdrawAmount <= balance) {
                        if (withdrawAmount % 500 == 0 && withdrawAmount <= 1000) {
                            balance -= withdrawAmount;
                            console.log(`Congrats! You have withdrawal Rs.${withdrawAmount}`);
                            console.log(`Balance Amount : Rs.${balance}`);
                        }
                    }
                    if (withdrawAmount == -1) {
                        console.log(`Thanks for using my withdrawal service!!`);
                        break;
                    }
                }
            } else {
                console.log(`Inccorrect PIN ! Three Attempts Completed ! Account Blocked !`);
            }




        </script>
