<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">
        <title>Check Positive Number</title>
    </head>

    <body>
        <script>

            var number = Number.parseInt(prompt(`Enter The number to check : `));

            if (number > 0) {
                console.log(`${number} is Positive!!`);
            } else if (number < 0) {
                console.log(`${number} is Negative!!`);
            } else {
                console.log(`Number is Zero!!`);
            }
        </script>
    </body>

</html>
