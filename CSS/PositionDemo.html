<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        position: sticky;
        top: 0px;
        left: 0px;
        width: 150px;
        height: 120px;
        background-color: aqua;
        z-index: 4;
      }

      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .box1 {
        position: relative;
        top: -80px;
        left: 30px;
        width: 150px;
        height: 120px;
        background-color: aqua;
        z-index: 3;
      }
      .box2 {
        position: relative;
        top: -160px;
        left: 60px;
        width: 150px;
        height: 120px;
        background-color: aqua;
        z-index: 2;
      }
      .box3 {
        position: relative;
        top: -240px;
        left: 90px;
        width: 150px;
        height: 120px;
        background-color: aqua;
        z-index: 1;
      }
      .parent {
        position: relative;
        width: 350px;
        height: 350px;
        background-color: rgb(31, 31, 77);
      }
      .child {
        position: fixed;
        float: right;
        bottom: 20px;
        right: 40px;
        width: 80px;
        height: 80px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="https://picsum.photos/350/250?random=1" alt="img1" />
    </div>
    <div class="box1">
      <img src="https://picsum.photos/350/250?random=2" alt="" />
    </div>
    <div class="box2">
      <img src="https://picsum.photos/350/250?random=3" alt="" />
    </div>
    <div class="box3">
      <img src="https://picsum.photos/350/250?random=4" alt="" />
    </div>

    <div class="parent">
      <div class="child"><img src="../assets/whatsapp logo.jpg" alt="" /></div>
    </div>
  </body>
</html>
