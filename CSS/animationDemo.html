<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 100px;
        height: 100px;
        background: red;
        animation: movingbox 5s infinite alternate;
        animation-delay: 5s;
        animation-iteration-count: 2;
      }

      @keyframes movingbox {
        0% {
          position: relative;
          top: 0;
          left: 0;
          background-color: red;
          transform: rotate(0deg);
        }
        25% {
          position: relative;
          top: 0;
          left: 750px;
          background: green;
          transform: rotate(90deg);
        }
        50% {
          position: relative;
          top: 350px;
          left: 750px;
          background: blue;
          transform: rotate(180deg);
        }
        75% {
          position: relative;
          top: 350px;
          left: 0px;
          background: yellow;
          transform: rotate(270deg);
        }
        100% {
          position: relative;
          top: 0;
          left: 0;
          background-color: red;
          transform: rotate(360deg);
        }
        /* from {
          transform: translateX(0);
          position: relative;
          top: 0;
          left: 0;
        }
        to {
          transform: translateX(500px);
          position: relative;
          top: 100px;
          left: 560px;
        } */
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
  </body>
</html>
